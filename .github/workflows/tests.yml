name: tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate --no-interaction
          touch database/database.sqlite
          php artisan migrate --force --no-interaction
          npm ci --no-audit --no-fund
          npm run build:ssr

      - name: Run CI Checks
        run: composer ci:check

      - name: Check deployment scripts
        run: |
          bash -n .github/deploy/*.sh
          shellcheck .github/deploy/*.sh
          for command in 'id' 'deploy invalid' 'deploy 0123456789012345678901234567890123456789; id'; do
            if SSH_ORIGINAL_COMMAND="$command" bash .github/deploy/ssh-command.sh; then
              echo 'An unauthorized SSH command was accepted.' >&2
              exit 1
            fi
          done
          php -l .github/deploy/health-check.php

  deployment-eligibility:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deploy: ${{ steps.merge.outputs.deploy }}
    steps:
      - name: Require a merged pull request for this exact commit
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pulls=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls?per_page=100")
          merged=$(jq --arg sha "$GITHUB_SHA" '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)] | length' <<< "$pulls")
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$merged" -gt 0 && "$head" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'Deployment skipped: not a merged PR at the current main commit.' >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: deployment-eligibility
    if: needs.deployment-eligibility.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: preview
      url: https://preview.jauharat.com
    concurrency:
      group: jbr-preview-deployment
      cancel-in-progress: false
    steps:
      - name: Deploy the tested commit
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/jbr-deploy-key"
          hosts_file="$RUNNER_TEMP/jbr-known-hosts"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts_file"
          ssh -i "$key_file" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA"
          echo "Deployed commit $GITHUB_SHA to the protected preview." >> "$GITHUB_STEP_SUMMARY"
