server {
    listen 80;
    listen [::]:80;
    server_name preview.jauharat.com;
    server_tokens off;
    access_log /var/log/nginx/jbr-review-access.log jbr_token_safe;
    error_log syslog:server=unix:/var/log/jbr-nginx-socket/error.sock,tag=jbr_review error;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://preview.jauharat.com$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name preview.jauharat.com;
    root /var/www/jbr/current/public;
    index index.php;
    server_tokens off;
    access_log /var/log/nginx/jbr-review-access.log jbr_token_safe;
    error_log syslog:server=unix:/var/log/jbr-nginx-socket/error.sock,tag=jbr_review error;
    ssl_certificate /etc/letsencrypt/live/preview.jauharat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview.jauharat.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:JBRSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    auth_basic "Jawharat Resort - private review";
    auth_basic_user_file /etc/nginx/jbr-review.htpasswd;
    client_max_body_size 16m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy $jbr_referrer_policy always;
    charset utf-8;
    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        internal;
        fastcgi_pass unix:/run/php/php8.5-jbr.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
