# HTTP context. Retain request audit fields without bearer URLs or referrers.
map $request_uri $jbr_audit_uri {
    default $request_uri;
    "~*(p|%70|%50)(a|%61|%41)(s|%73|%53)(s|%73|%53)(w|%77|%57)(o|%6f|%4f)(r|%72|%52)(d|%64|%44)(-|%2d)(r|%72|%52)(e|%65|%45)(s|%73|%53)(e|%65|%45)(t|%74|%54)" "/admin/password-reset/[redacted]";
    "~*(t|%74|%54)(o|%6f|%4f)(k|%6b|%4b)(e|%65|%45)(n|%6e|%4e)(=|%3d)" "[credential-query-redacted]";
    "~*[a-f0-9]{64}" "[credential-like-uri-redacted]";
}
map $http_referer $jbr_audit_referer {
    default $http_referer;
    "~*(p|%70|%50)(a|%61|%41)(s|%73|%53)(s|%73|%53)(w|%77|%57)(o|%6f|%4f)(r|%72|%52)(d|%64|%44)(-|%2d)(r|%72|%52)(e|%65|%45)(s|%73|%53)(e|%65|%45)(t|%74|%54)" "[password-setup-referrer-redacted]";
    "~*(t|%74|%54)(o|%6f|%4f)(k|%6b|%4b)(e|%65|%45)(n|%6e|%4e)(=|%3d)" "[credential-query-referrer-redacted]";
    "~*[a-f0-9]{64}" "[credential-like-referrer-redacted]";
}
map $request_uri $jbr_referrer_policy {
    default "strict-origin-when-cross-origin";
    "~*(p|%70|%50)(a|%61|%41)(s|%73|%53)(s|%73|%53)(w|%77|%57)(o|%6f|%4f)(r|%72|%52)(d|%64|%44)(-|%2d)(r|%72|%52)(e|%65|%45)(s|%73|%53)(e|%65|%45)(t|%74|%54)" "no-referrer";
}
log_format jbr_token_safe escape=json
    '{"time":"$time_iso8601","client":"$remote_addr","server":"$server_name",'
    '"method":"$request_method","uri":"$jbr_audit_uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration":$request_time,"upstream_status":"$upstream_status",'
    '"connection":"$connection","referrer":"$jbr_audit_referer"}';
