# Dedicated in-memory input: raw Nginx errors never enter default syslog/journal rules.
# Preserve full ordinary diagnostics. Credential-bearing errors retain severity,
# reason and client address; sanitized access records retain request/status/timing.
template(name="JbrSafeNginxError" type="string"
    string="%timereported:::date-rfc3339% %hostname% %syslogtag% %syslogseverity-text% %$!jbr_safe_message%\n")
ruleset(name="jbr_nginx_safe_errors" queue.type="Direct") {
    set $!jbr_safe_message = $msg;
    if re_match(tolower($msg), "(p|%70|%50)(a|%61|%41)(s|%73|%53)(s|%73|%53)(w|%77|%57)(o|%6f|%4f)(r|%72|%52)(d|%64|%44)(-|%2d)(r|%72|%52)(e|%65|%45)(s|%73|%53)(e|%65|%45)(t|%74|%54)|(t|%74|%54)(o|%6f|%4f)(k|%6b|%4b)(e|%65|%45)(n|%6e|%4e)(=|%3d)|[a-f0-9]{64}") then {
        set $.reason = "credential-bearing error detail redacted";
        if $msg contains "connect() failed" then {
            set $.reason = "connect() failed";
        } else if $msg contains "upstream timed out" then {
            set $.reason = "upstream timed out";
        } else if $msg contains "access forbidden" then {
            set $.reason = "access forbidden by rule";
        } else if $msg contains "open()" then {
            set $.reason = "filesystem open failed";
        } else if $msg contains "client sent" then {
            set $.reason = "client request rejected";
        } else if $msg contains "SSL_do_handshake()" then {
            set $.reason = "TLS handshake failed";
        } else if $msg contains "upstream" then {
            set $.reason = "upstream request failed";
        }
        set $!jbr_safe_message = $.reason & ", client: " & re_extract($msg, "client: ([0-9a-fA-F.:]{1,45})(,| )", 0, 1, "unknown") & "; credential-bearing request details redacted; see access audit";
    }
    action(type="omfile" file="/var/log/jbr-nginx/errors.log"
        template="JbrSafeNginxError" fileOwner="syslog" fileGroup="adm"
        fileCreateMode="0640" sync="on")
    stop
}
input(type="imuxsock" Socket="/var/log/jbr-nginx-socket/error.sock"
    CreatePath="off" RateLimit.Interval="0" Ruleset="jbr_nginx_safe_errors")
